openapi: 3.0.3
info:
  title: UB-DormHub - Verify Maintenance Report
  version: 0.2.0
  description: Core UC-04 contract for Lab 8. Uses synthetic/anonymised prototype data.
paths:
  /api/v1/complaints/{complaintId}/verification:
    post:
      operationId: verifyMaintenanceReport
      summary: Verify or reject a Reported maintenance complaint
      security:
        - bearerAuth: []
      parameters:
        - name: complaintId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationRequest' }
      responses:
        '200':
          description: Complaint rejected and reason recorded; on replay returns the same response with Idempotent-Replayed true
          headers:
            Idempotent-Replayed:
              schema: { type: boolean }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RejectedResult' }
        '201':
          description: Complaint verified and CertificationRecord created; on replay returns the same response with Idempotent-Replayed true
          headers:
            Idempotent-Replayed:
              schema: { type: boolean }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifiedResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { $ref: '#/components/responses/ComplaintNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    VerificationRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [VERIFY, REJECT]
        rejectionReason:
          type: string
          minLength: 10
          maxLength: 500
          description: Required for REJECT and absent for VERIFY (enforced by application validation)
    Certification:
      type: object
      additionalProperties: false
      required: [certificationId, certifiedBy, certifiedDate]
      properties:
        certificationId: { type: integer }
        certifiedBy: { type: integer }
        certifiedDate: { type: string, format: date-time }
    VerifiedResult:
      type: object
      additionalProperties: false
      required: [complaintId, status, certification]
      properties:
        complaintId: { type: integer }
        status: { type: string, enum: [VERIFIED] }
        certification: { $ref: '#/components/schemas/Certification' }
    RejectedResult:
      type: object
      additionalProperties: false
      required: [complaintId, status, rejectionReason]
      properties:
        complaintId: { type: integer }
        status: { type: string, enum: [REJECTED] }
        rejectionReason: { type: string, minLength: 10, maxLength: 500 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN_ROLE, COMPLAINT_NOT_FOUND,
                     INVALID_STATE, IDEMPOTENCY_KEY_REUSED, PERSISTENCE_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string }
            currentStatus: { type: string, description: Present for INVALID_STATE when known }
  responses:
    ValidationFailed:
      description: VALIDATION_FAILED - no state change
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: UNAUTHENTICATED - no state change
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ForbiddenRole:
      description: FORBIDDEN_ROLE - no state change
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ComplaintNotFound:
      description: COMPLAINT_NOT_FOUND - no state change
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: INVALID_STATE or IDEMPOTENCY_KEY_REUSED - no state change by this request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PersistenceUnavailable:
      description: PERSISTENCE_UNAVAILABLE - active transaction rolled back; retry same request with same Idempotency-Key
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: INTERNAL_ERROR - active transaction rolled back where possible
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
